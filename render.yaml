# render.yaml — SentinelOps AI Infrastructure as Code
# Render will read this file and provision all services automatically.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── API (Express + Prisma) ─────────────────────────────────────────────────
  - type: web
    name: sentinelops-api
    runtime: node
    region: oregon
    plan: free
    repo: https://github.com/NodeNexus/SentinelOps
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false          # You must set this manually in the dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  - type: web
    name: sentinelops-web
    runtime: node
    region: oregon
    plan: free
    repo: https://github.com/NodeNexus/SentinelOps
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/apps/web/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: sentinelops-api
          type: web
          property: host
          envVarKey: NEXT_PUBLIC_API_URL

# ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: sentinelops-db
    region: oregon
    plan: free
    databaseName: sentinelops
    user: sentinel
