name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinelops

      - name: Build API
        run: npm --workspace @sentinelops/api run build

      - name: Build Web
        run: npm --workspace @sentinelops/web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
